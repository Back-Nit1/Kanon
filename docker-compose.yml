# Ingest infrastructure: Postgres (job queue, dead letter queue, chunk metadata) and a Chroma
# server (the local PersistentClient is single-process; parallel workers need the server).
#   docker compose up -d
#   KANON_CHROMA_URL=http://localhost:8000 uv run kanon ingest
services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: kanon
      POSTGRES_PASSWORD: kanon      # local dev only; set a real secret anywhere shared
      POSTGRES_DB: kanon
    ports: ["127.0.0.1:5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  chroma:
    image: chromadb/chroma:1.5.9    # match the chromadb client pinned in uv.lock
    ports: ["127.0.0.1:8000:8000"]
    volumes: [chromadata:/data]
volumes:
  pgdata:
  chromadata:
