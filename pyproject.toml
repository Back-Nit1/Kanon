[project]
name = "kanon"
version = "0.1.0"
description = "Authority-aware retrieval over NRC regulatory documents"
requires-python = ">=3.12"
dependencies = [
  "langchain>=1.0",
  "langchain-core>=1.0",
  "langchain-openai>=1.0",
  "langgraph>=1.0",
  "chromadb>=1.0",
  "rank-bm25>=0.2.2",
  "docling>=2.0",
  "pydantic>=2.7",
  "python-dotenv>=1.0",
  "pyyaml>=6.0",
]

[project.scripts]
kanon = "kanon.cli:main"
kanon-eval = "kanon.evals:main"

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]
